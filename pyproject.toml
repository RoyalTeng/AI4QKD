[project]
name = "qkdx"
version = "0.0.1"
description = "Numerical QKD rate bounds under MS-EB framework"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Teng, Jun", email = "aredalkkosft66@gmail.com" }]
dependencies = [
    "numpy==2.1.*",
    "scipy==1.14.*",
    "cvxpy==1.5.*",
    "clarabel==0.9.*",
    "scs==3.2.*",
    "structlog==24.*",
]

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-cov==5.*",
    "mypy==1.11.*",
    "ruff==0.6.*",
    "papermill==2.*",
    "jupyter==1.*",
]
optional = [
    "mosek==10.2.*",  # 可选求解器,需要学术许可
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qkdx*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: SDP 单次 > 10s 的测试",
    "research: 研究级别耗时测试,手动触发",
    "fallback_solver: 使用 CLARABEL/SCS fallback 求解器的测试",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
