[tool:pytest]
# AI4QKD pytest配置文件
# 
# 重构思路：
# - 基于原有项目的测试配置
# - 优化测试发现和运行配置
# - 支持多种测试运行模式
# - 简化开发过程中的测试体验

# 测试文件发现配置
testpaths = tests
python_files = test_*.py *_test.py test_*_refactor.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings

# 最小pytest版本要求
minversion = 6.0

# 测试标记
markers =
    unit: 单元测试 - 测试单个模块或函数
    integration: 集成测试 - 测试模块间协作
    performance: 性能测试 - 测试执行性能和资源使用
    compatibility: 兼容性测试 - 测试向后兼容性
    slow: 慢速测试 - 执行时间较长的测试
    requires_qiskit: 需要Qiskit库的测试
    requires_display: 需要显示设备的测试
    refactor: 重构相关测试 - 验证重构后功能正确性

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore:.*matplotlib.*:UserWarning
    ignore:.*qiskit.*:DeprecationWarning

# 测试超时配置（如果安装了pytest-timeout）
timeout = 300

# 并行测试配置（如果安装了pytest-xdist）
# addopts += -n auto